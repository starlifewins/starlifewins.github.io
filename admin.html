<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px}.box{max-width:400px;margin:80px auto;text-align:center}input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none}button{background:#facc15;font-weight:bold;color:#000}.card{background:#1e293b;padding:12px;border-radius:10px;margin:8px 0;text-align:left}</style></head><body><div id="a" class="box"><h2>ADMIN LOGIN</h2><input id="p" type="password" placeholder="Password"><button onclick="if(p.value=='1234'){a.style.display='none';b.style.display='block';load()}else{alert('Wrong!')}">LOGIN</button></div><div id="b" style="display:none"><h2>PAYMENTS LIST</h2><div id="l"></div></div><script>function load(){let u=JSON.parse(localStorage.getItem('starlife_users')||'[]');let h=u.length? '': '<p>Hakuna user</p>';u.forEach(x=>{h+=`<div class=card><b>${x.name}</b><br>${x.phone}<br>Code:${x.code}<br>${x.time}</div>`});document.getElementById('l').innerHTML=h}</script></body></html>
