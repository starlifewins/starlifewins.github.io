<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN FINAL</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding:12px}.card{background:#fff;color:#000;border-radius:12px;padding:12px;margin-bottom:10px}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:700}</style></head><body><div id="l" style="max-width:340px;margin:70px auto;background:#1e293b;padding:20px;border-radius:16px;text-align:center"><h3>ADMIN LOGIN</h3><input id="pw" type="password" placeholder="Alfuu2024" style="width:100%;padding:10px;border-radius:10px;margin-top:12px"><button onclick="if(pw.value==='Alfuu2024'){l.style.display='none';m.style.display='block';load()}else alert('Wrong! Type Alfuu2024')" style="width:100%;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:10px;margin-top:10px;font-weight:700">LOGIN</button></div><div id="m" style="display:none;max-width:600px;margin:0 auto"><h3>Pending</h3><div id="p"></div><h3 style="margin-top:15px">Approved</h3><div id="a"></div><h3 style="margin-top:15px">Rejected</h3><div id="r"></div></div><script>function load(){let d=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');let pe=d.filter(x=>x.status=='pending'),ap=d.filter(x=>x.status=='paid'),re=d.filter(x=>x.status=='rejected');p.innerHTML=pe.length?pe.map(x=>`<div class=card><b>KES ${x.amount} - ${x.username}</b><br>📱 ${x.phone} (${x.name})<br><button onclick="ok('${x.id}')" style="background:green;color:#fff;padding:6px 10px;border:none;border-radius:6px">Approve</button> <button onclick="no('${x.id}')" style="background:red;color:#fff;padding:6px 10px;border:none;border-radius:6px">Reject</button></div>`).join(''):'No pending';a.innerHTML=ap.map(x=>`<div class=card>${x.username} ${x.phone} KES ${x.amount}</div>`).join('')||'None';r.innerHTML=re.map(x=>`<div class=card>${x.username} ${x.phone} KES ${x.amount}</div>`).join('')||'None'}function ok(id){let d=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');d.find(x=>x.id==id).status='paid';localStorage.setItem('starlife_withdraw_requests',JSON.stringify(d));load()}function no(id){let d=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');d.find(x=>x.id==id).status='rejected';localStorage.setItem('starlife_withdraw_requests',JSON.stringify(d));load()}</script></body></html>
