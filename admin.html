<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:10px}
.box{background:#131a33;padding:15px;border-radius:12px;max-width:500px;margin:auto}
button{width:100%;padding:13px;margin:6px 0;border:none;border-radius:8px;background:#6a5cff;color:#fff;font-weight:800;font-size:16px}
.card{background:#1d264d;padding:12px;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#6a5cff">STARLIFE ADMIN</h2>
<button onclick="load()">🔄 REFRESH PENDING</button>
<div id="list" style="margin-top:15px"></div>
</div>

<script>
function G(){ return JSON.parse(localStorage.getItem('S')||'[]'); }
function S(v){ localStorage.setItem('S',JSON.stringify(v)); }

function load(){
 var a = G();
 var p = a.filter(x=>x.paid==1 && x.ap!=1);
 var el = document.getElementById('list');
 if(p.length==0){
   el.innerHTML = '<p style="text-align:center;color:#aaa">No pending payments on this phone.</p>';
   return;
 }
 var html = '';
 for(var i=0;i<p.length;i++){
   var x = p[i];
   html += '<div class="card"><b>'+x.f+'</b> ('+x.u+')<br>Phone: '+x.ph+'<br>CODE: <b style="color:yellow;font-size:18px">'+x.mc+'</b><br><br><button onclick="approveUser(\''+x.u+'\')">✅ APPROVE KSh 200</button></div>';
 }
 el.innerHTML = html;
}

function approveUser(u){
 var a = G();
 for(var i=0;i<a.length;i++){ if(a[i].u==u){ a[i].ap=1; if(a[i].ref){ for(var j=0;j<a.length;j++){ if(a[j].u==a[i].ref){ a[j].bal=(a[j].bal||0)+100; } } } } }
 S(a);
 alert(u + ' APPROVED!');
 load();
}

load();
</script>
</body>
</html>
