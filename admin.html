<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:14px}.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:10px}button{padding:8px 12px;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}</style></head><body><h2>⭐ STARLIFE ADMIN</h2><h3 style="color:#a78bfa;margin-top:15px">Activations</h3><div id="acts"></div><h3 style="color:#a78bfa;margin-top:15px">Withdrawals</h3><div id="list"></div><script>function load(){let acts=JSON.parse(localStorage.getItem('sl_activations')||'[]');document.getElementById('acts').innerHTML=acts.slice().reverse().map(a=>`<div class=card><b>${a.username}</b> - ${a.phone}<br>Code: ${a.code}<br>Status: ${a.status.toUpperCase()}<br>${a.status=='pending'?`<button style="background:#10b981" onclick="approveAct('${a.username}','${a.code}')">Approve Account</button>`:''}</div>`).join('')||'No activations';let reqs=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');document.getElementById('list').innerHTML=reqs.slice().reverse().map(r=>`<div class=card><b>${r.username}</b> - KES ${r.amount} (${r.type})<br>${r.phone} | ${r.id} - <b style="color:${r.status=='pending'?'orange':'#10b981'}">${r.status.toUpperCase()}</b><br>${r.status=='pending'?`<button style="background:#10b981;margin-top:6px" onclick="approveW('${r.id}')">Approve</button> <button style="background:#ef4444;margin-top:6px" onclick="rejectW('${r.id}')">Reject</button>`:''}</div>`).join('')||'No requests';}function approveAct(username,code){let acts=JSON.parse(localStorage.getItem('sl_activations')||'[]');let a=acts.find(x=>x.code===code);if(a){a.status='approved';localStorage.setItem('sl_activations',JSON.stringify(acts));let users=JSON.parse(localStorage.getItem('sl_users')||'[]');let u=users.find(x=>x.username===username);if(u){u.active=true;localStorage.setItem('sl_users',JSON.stringify(users));}load();}}function approveW(id){let reqs=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');let r=reqs.find(x=>x.id===id);if(!r||r.status!=='pending')return;let users=JSON.parse(localStorage.getItem('sl_users')||'[]');let u=users.find(x=>x.username===r.username);if(u){u.tot+=r.amount;u.pen-=r.amount;r.status='approved';localStorage.setItem('sl_users',JSON.stringify(users));localStorage.setItem('starlife_withdraw_requests',JSON.stringify(reqs));}load();}function rejectW(id){let reqs=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');let r=reqs.find(x=>x.id===id);if(!r||r.status!=='pending')return;let users=JSON.parse(localStorage.getItem('sl_users')||'[]');let u=users.find(x=>x.username===r.username);if(u){if(r.type==='activity')u.actBal+=r.amount;else u.bal+=r.amount;u.pen-=r.amount;r.status='rejected';localStorage.setItem('sl_users',JSON.stringify(users));localStorage.setItem('starlife_withdraw_requests',JSON.stringify(reqs));}load();}load();</script></body></html>
