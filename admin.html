<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin REAL</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:14px}.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:10px}button{padding:8px 12px;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}</style></head><body><h2>⭐ STARLIFE ADMIN - REAL</h2><p style="color:#94a3b8">Activation KES 150 - Shows ALL phones</p><button onclick="load()" style="background:#7c3aed;padding:10px;margin-bottom:10px">🔄 Refresh</button><h3 style="color:#a78bfa">Activations Pending - KES 150</h3><div id="acts"></div><h3 style="color:#a78bfa;margin-top:15px">Withdrawals - Min 300</h3><div id="list"></div><script>
const API="https://api.npoint.io/6a0d3448a56621e390fd";
async function getDB(){let r=await fetch(API);return await r.json();}
async function saveDB(db){await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});}
async function load(){
let db=await getDB();
acts.innerHTML=db.activations.slice().reverse().map((a,i)=>{let idx=db.activations.length-1-i;return `<div class=card><b>${a.username}</b> - ${a.phone}<br>Code: <b style="color:#facc15">${a.code}</b> - <b>${a.status.toUpperCase()}</b><br>${a.status=='pending'?`<button onclick="approveAct(${idx})" style="background:#10b981;margin-top:6px">Approve - Activate KES 150</button>`:''}<br><small>${a.date}</small></div>`}).join('')||'No activations';
list.innerHTML=db.withdrawals.slice().reverse().map((r,i)=>{let idx=db.withdrawals.length-1-i;return `<div class=card><b>${r.username}</b> KES ${r.amount} (${r.type})<br>${r.phone} - ${r.status}<br>${r.status=='pending'?`<button onclick="approveW(${idx})" style="background:#10b981">Approve</button> <button onclick="rejectW(${idx})" style="background:#ef4444">Reject</button>`:''}</div>`}).join('')||'No withdrawals';
}
async function approveAct(idx){let db=await getDB();let a=db.activations[idx];a.status='approved';let u=db.users.find(x=>x.username===a.username);if(u)u.active=true;await saveDB(db);alert('Approved '+a.username+' - KES 150');load();}
async function approveW(idx){let db=await getDB();let r=db.withdrawals[idx];r.status='approved';let u=db.users.find(x=>x.username===r.username);if(u){u.tot+=r.amount;u.pen-=r.amount;}await saveDB(db);load();}
async function rejectW(idx){let db=await getDB();let r=db.withdrawals[idx];r.status='rejected';let u=db.users.find(x=>x.username===r.username);if(u){if(r.type=='activity')u.actBal+=r.amount;else u.bal+=r.amount;u.pen-=r.amount;}await saveDB(db);load();}
load();
</script></body></html>
