<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE</title>
<style>body{margin:0;background:#060a18;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}.card{background:#151b2d;padding:20px;border-radius:16px;max-width:400px;width:100%;border:1px solid #f59e0b}input{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #333;background:#0f172a;color:#fff;box-sizing:border-box}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.y{background:#f59e0b;color:#000}.g{background:#1e293b;color:#fff}</style></head><body>
<div class="card"><h2 style="color:#f59e0b;text-align:center">★ STARLIFE AGENCIES</h2><p style="font-size:12px;color:#94a3b8;text-align:center">Sign up to earn 500-1000 daily</p>
<input id="fullname" placeholder="Full Name"><input id="username" placeholder="Username"><input id="phone" placeholder="M-Pesa Phone 07..."><input id="pass" type="password" placeholder="Password"><input id="cpass" type="password" placeholder="Confirm Password">
<p style="font-size:11px;color:#94a3b8">Referred by: <b id="refBy" style="color:#00ff88">None</b></p>
<button class="btn y" onclick="signup()">CREATE ACCOUNT</button><button class="btn g" onclick="location.href='login.html'">Already have? Login</button></div>
<script>
let params=new URLSearchParams(location.search); let ref=params.get('ref'); if(ref) document.getElementById('refBy').innerText=ref;
function signup(){let f=fullname.value,u=username.value,p=phone.value,ps=pass.value,cp=cpass.value; if(!f||!u||!p||!ps) return alert('Jaza zote'); if(ps!==cp) return alert('Password mismatch'); let users=JSON.parse(localStorage.getItem('star_users')||'[]'); if(users.find(x=>x.username===u)) return alert('Username taken'); users.push({fullname:f,username:u,phone:p,password:ps,referredBy:ref||null,activated:false,time:new Date().toLocaleString()}); localStorage.setItem('star_users',JSON.stringify(users)); localStorage.setItem('current_user',u); location.href='activation.html';}
</script></body></html>
