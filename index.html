<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARLIFE ADMIN</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding:12px}.tab{padding:10px 14px;border-radius:10px;cursor:pointer;background:#1e293b;margin-right:6px;font-weight:700}.tab.active{background:#7c3aed}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:12px;margin-bottom:10px}</style></head><body>
<div id="login" style="max-width:320px;margin:100px auto;background:#1e293b;padding:20px;border-radius:16px;text-align:center"><h2>ADMIN LOGIN</h2><input id="pass" type="password" placeholder="Password" style="width:100%;padding:12px;margin:12px 0;border-radius:10px;border:1px solid #334155"><button onclick="login()" style="width:100%;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-weight:800">LOGIN</button></div>
<div id="panel" style="display:none"><h2>STARLIFE ADMIN - Alfuu</h2><div style="display:flex;margin:12px 0;flex-wrap:wrap"><div class="tab active" onclick="show('pending')" id="t-pending">Pending (<span id="c-pending">0</span>)</div><div class="tab" onclick="show('paid')" id="t-paid">Approved (<span id="c-paid">0</span>)</div><div class="tab" onclick="show('rejected')" id="t-rejected">Rejected (<span id="c-rejected">0</span>)</div><div class="tab" onclick="show('refs')" id="t-refs">Referrals 🔔 (<span id="c-refs">0</span>)</div></div><div id="list"></div><button onclick="localStorage.clear();location.reload()" style="margin-top:20px;padding:8px 12px;border-radius:8px;background:#334155;color:#fff;border:none">Clear All (Test)</button></div>
<script>
function login(){if(document.getElementById('pass').value==='Alfuu2024'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';render()}else alert('Wrong password')}
let current='pending';
function show(t){current=t;document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('t-'+t).classList.add('active');render()}
function render(){
  let reqs=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');
  let refs=JSON.parse(localStorage.getItem('starlife_referrals')||'[]');
  document.getElementById('c-pending').innerText=reqs.filter(r=>r.status=='pending').length;
  document.getElementById('c-paid').innerText=reqs.filter(r=>r.status=='paid').length;
  document.getElementById('c-rejected').innerText=reqs.filter(r=>r.status=='rejected').length;
  document.getElementById('c-refs').innerText=refs.length;
  let html='';
  if(current==='refs'){
    html=refs.length?refs.slice().reverse().map(r=>`<div class=card><b>Referrer: ${r.referrer}</b> → New: ${r.newUser}<br><small>${new Date(r.date).toLocaleString()} - KES ${r.amount}</small><div style="color:#10b981;margin-top:6px">🔔 ${r.referrer} earned 100!</div></div>`).join(''):'<div class=card>No referrals yet</div>';
  }else{
    let filtered=reqs.filter(r=>r.status===current);
    html=filtered.length?filtered.slice().reverse().map(r=>`<div class=card><b>${r.id} - KES ${r.amount}</b><br>${r.name} - ${r.phone}<br><small>${new Date(r.date).toLocaleString()}</small><div style="margin-top:8px"><button onclick="approve('${r.id}')" style="padding:8px 12px;background:#10b981;color:#fff;border:none;border-radius:8px;margin-right:6px">Approve - Goes to Total</button><button onclick="reject('${r.id}')" style="padding:8px 12px;background:#ef4444;color:#fff;border:none;border-radius:8px">Reject</button></div></div>`).join(''):'<div class=card>No '+current+'</div>';
  }
  document.getElementById('list').innerHTML=html;
}
function approve(id){
  let reqs=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');
  let r=reqs.find(x=>x.id===id); if(!r) return;
  r.status='paid';
  localStorage.setItem('starlife_withdraw_requests',JSON.stringify(reqs));
  // MOVE PENDING -> TOTAL
  let pen=parseInt(localStorage.getItem('sl_pen')||'0');
  let tot=parseInt(localStorage.getItem('sl_tot')||'0');
  pen=Math.max(0,pen-r.amount); tot+=r.amount;
  localStorage.setItem('sl_pen',pen); localStorage.setItem('sl_tot',tot);
  alert('Approved! KES '+r.amount+' moved to TOTAL WITHDRAWAL');
  render();
}
function reject(id){
  let reqs=JSON.parse(localStorage.getItem('starlife_withdraw_requests')||'[]');
  let r=reqs.find(x=>x.id===id); if(!r) return;
  r.status='rejected';
  let pen=parseInt(localStorage.getItem('sl_pen')||'0');
  let bal=parseInt(localStorage.getItem('sl_bal')||'0');
  pen=Math.max(0,pen-r.amount); bal+=r.amount;
  localStorage.setItem('starlife_withdraw_requests',JSON.stringify(reqs));
  localStorage.setItem('sl_pen',pen); localStorage.setItem('sl_bal',bal);
  render();
}
</script></body></html>
