<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARLIFE AGENCIES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9}
.header{background:#7c3aed;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.main{padding:14px;max-width:480px;margin:0 auto}
.card{border-radius:24px;padding:18px;color:#fff;margin-bottom:14px}
.purple{background:linear-gradient(135deg,#4c1d95,#7c3aed)}
.blue{background:linear-gradient(135deg,#1e40af,#3b82f6)}
.green{background:linear-gradient(135deg,#065f46,#10b981)}
#login{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body>

<div id="login">
  <div style="background:#fff;border-radius:24px;padding:24px;width:100%;max-width:360px;color:#000">
    <h2 style="color:#7c3aed">⭐ STARLIFE</h2>
    <p style="color:#64748b;margin:10px 0">Create your account</p>
    <input id="regName" placeholder="Username e.g Faith" style="width:100%;padding:14px;border-radius:12px;border:2px solid #7c3aed;margin:12px 0;font-size:16px">
    <input id="regPhone" placeholder="Phone 07..." style="width:100%;padding:14px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:12px;font-size:16px">
    <button onclick="doRegister()" style="width:100%;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:14px;font-weight:800">CONTINUE</button>
  </div>
</div>

<div class="header">
  <span>☰</span><b>STARLIFE AGENCIES</b><span>👤</span>
</div>

<div class="main">
  <div style="margin:10px 4px">
    <small style="color:#64748b">Good morning,</small>
    <b id="showName" style="font-size:32px;display:block;color:#000">...</b>
    <small id="showPhone" style="color:#94a3b8"></small>
  </div>

  <div class="card purple">
    <h4>EXPENSES •••</h4>
    <b style="font-size:36px;display:block;margin:10px 0">KES 150</b>
    <small>30% used • KES 500 limit</small>
  </div>

  <div class="card blue">
    <h4>ACTIVE BALANCE 💰 <span id="refCount" style="float:right;font-size:11px;background:rgba(255,255,255,.3);padding:4px 8px;border-radius:10px">0 REF</span></h4>
    <b id="bal" style="font-size:36px;display:block;margin:10px 0">KES 0</b>
    <small>+ KES 100 per referral</small>
  </div>

  <div class="card green">
    <h4>TOTAL WITHDRAWAL ↗</h4>
    <b id="tot" style="font-size:36px;display:block;margin:10px 0">KES 0</b>
    <small>Total paid via M-Pesa</small>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="card purple" style="margin:0"><b>Withdraw<br><small>To M-Pesa</small></b></div>
    <div class="card" style="margin:0;background:linear-gradient(135deg,#ea580c,#fb923c)"><b>History<br><small>Transactions</small></b></div>
  </div>

  <div class="card" style="background:#fff;color:#000;margin-top:14px">
    <b>YOUR REFERRAL LINK</b>
    <div id="refLink" style="color:#7c3aed;font-weight:700;font-size:11px;word-break:break-all;margin:10px 0"></div>
    <button onclick="navigator.clipboard.writeText(document.getElementById('refLink').innerText);alert('Link Copied!')" style="width:100%;padding:12px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;font-weight:700">📋 Copy Link</button>
  </div>
</div>

<script>
let params = new URLSearchParams(location.search);
let refBy = params.get('ref');

function doRegister(){
  let n = document.getElementById('regName').value.trim();
  let p = document.getElementById('regPhone').value.trim();
  if(!n){ alert('Enter username'); return; }
  if(!p){ p='07'+Math.floor(10000000+Math.random()*89999999); }
  localStorage.setItem('sl_username', n);
  localStorage.setItem('sl_phone', p);
  
  // save referral
  if(refBy && refBy!==p){
    let all=JSON.parse(localStorage.getItem('starlife_referrals')||'[]');
    if(!all.find(r=>r.newUser===p && r.referrer===refBy)){
      all.push({referrer:refBy,newUser:p,newUserName:n,date:new Date().toISOString(),amount:100});
      localStorage.setItem('starlife_referrals',JSON.stringify(all));
    }
  }
  document.getElementById('login').style.display='none';
  start();
}

function start(){
  let phone = localStorage.getItem('sl_phone');
  let username = localStorage.getItem('sl_username');
  if(!phone || !username){
    document.getElementById('login').style.display='flex';
    return;
  }
  // THIS IS THE FIX - SHOWS CLIENT'S OWN NAME
  document.getElementById('showName').innerText = username + ' 👋';
  document.getElementById('showPhone').innerText = phone;
  document.getElementById('refLink').innerText = 'https://starlifewins.github.io/?ref='+phone;
  
  let all=JSON.parse(localStorage.getItem('starlife_referrals')||'[]');
  let mine=all.filter(r=>r.referrer===phone).length;
  let bal=parseInt(localStorage.getItem('sl_bal')||'0');
  let credited=parseInt(localStorage.getItem('sl_ref_credited')||'0');
  if(mine*100>credited){
    bal+=(mine*100-credited);
    localStorage.setItem('sl_bal',bal);
    localStorage.setItem('sl_ref_credited',mine*100);
  }
  document.getElementById('bal').innerText='KES '+bal;
  document.getElementById('refCount').innerText=mine+' REFERRALS';
}
start();
</script>
</body>
</html>
